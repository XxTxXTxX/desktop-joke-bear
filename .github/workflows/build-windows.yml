name: build-windows-exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow
          python -m pip install --target .deps pillow

      - name: Build app
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --icon "assets/icon.ico" --name 自嘲熊 `
            --paths .deps `
            --add-data "main.py;." `
            --add-data "bearpet;bearpet" `
            --add-data "assets;assets" `
            bootstrap.py

      - name: Package app folder
        run: |
          Compress-Archive -Path dist/自嘲熊 -DestinationPath dist/自嘲熊-windows.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: 自嘲熊-windows
          path: dist/自嘲熊-windows.zip
